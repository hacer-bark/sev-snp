[package]
name = "sev-snp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
readme = "README.md"
authors = ["Hacer-Bark <hacer.bark@proton.me>"]
description = "Safe, complete Rust bindings for the Linux AMD SEV-SNP guest API"
license = "0BSD"
repository = "https://github.com/hacer-bark/sev-snp"
documentation = "https://docs.rs/sev-snp"
categories = ["api-bindings", "cryptography", "hardware-support"]
keywords = ["sev", "snp", "attestation", "amd"]
exclude = [".github/"]

# The guest interface is a Linux kernel API, so the crate is Linux-only: the
# `sev-guest` transport needs `libc::ioctl` and `std::os::fd` outright.
[dependencies]
libc = { version = "0.2", optional = true }
zeroize = { version = "1", default-features = false, optional = true }

[dev-dependencies]
rand = "0.10"

[[example]]
name = "derive_key"
required-features = ["sev-guest"]

[features]
default = ["configfs", "sev-guest"]
# The configfs-TSM transport (`/sys/kernel/config/tsm/report`, Linux 6.7+).
# Attestation reports only; contains no `unsafe` and pulls in no C bindings.
configfs = []
# The `/dev/sev-guest` ioctl transport (Linux 5.19+). Required for key
# derivation, and the only transport that surfaces firmware status codes.
# Pulls in `libc` and contains this crate's single `unsafe` block.
sev-guest = ["dep:libc", "dep:zeroize"]

[lints.rust]
warnings = "deny"
future_incompatible = "deny"
unused = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"

[lints.rustdoc]
all = "deny"
broken_intra_doc_links = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
